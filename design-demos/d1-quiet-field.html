<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direction 1 · Quiet Field — Habu Auth</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Roboto, "Helvetica Neue", Arial, sans-serif; background: #EDEDED; color: #1A1A1A; }
  #root { padding: 32px 24px 80px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ---------- Habu grayscale tokens (design doc §4.1) ---------- */
function tok(dark) {
  return {
    base: dark ? '#000000' : '#FFFFFF',
    surface: dark ? '#161616' : '#F5F5F5',
    border: dark ? '#2A2A2A' : '#E0E0E0',
    primary: dark ? '#FAFAFA' : '#0A0A0A',
    secondary: dark ? '#9A9A9A' : '#6B6B6B',
    tertiary: dark ? '#6B6B6B' : '#A3A3A3',
  };
}

/* ---------- Habu wordmark · mark = 2×2 heatmap cells w/ intensity opacity ---------- */
function Wordmark({ dark, size = 30 }) {
  const c = tok(dark);
  const s = size * 0.62;
  const cell = { width: s, height: s, borderRadius: s * 0.33 };
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <div style={{ display: 'grid', gridTemplateColumns: `${s}px ${s}px`, gap: 3 }}>
        <div style={{ ...cell, background: c.primary }} />
        <div style={{ ...cell, background: c.primary, opacity: 0.55 }} />
        <div style={{ ...cell, background: c.primary, opacity: 0.28 }} />
        <div style={{ ...cell, border: `2px solid ${c.primary}`, opacity: 0.85 }} />
      </div>
      <span style={{ fontSize: size, fontWeight: 800, color: c.primary, letterSpacing: -0.5 }}>
        Habu
      </span>
    </div>
  );
}

/* ---------- form primitives ---------- */
function Field({ label, placeholder, dark, secure = false }) {
  const c = tok(dark);
  const [show, setShow] = useState(!secure);
  const [focus, setFocus] = useState(false);
  return (
    <div style={{ width: '100%', textAlign: 'left' }}>
      <div style={{ fontSize: 13, color: c.secondary, marginBottom: 6, fontWeight: 500 }}>{label}</div>
      <div style={{
        display: 'flex', alignItems: 'center', height: 50, borderRadius: 16,
        background: c.surface, border: focus ? `1.5px solid ${c.primary}` : `1px solid ${c.border}`,
        paddingLeft: 16, paddingRight: 14,
      }}>
        <input
          type={show ? 'text' : 'password'}
          placeholder={placeholder}
          onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
          style={{
            flex: 1, border: 'none', outline: 'none', background: 'transparent',
            fontSize: 17, color: c.primary, fontFamily: 'inherit', height: '100%',
          }}
        />
        {secure ? (
          <button
            onClick={() => setShow(!show)}
            style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 4, fontSize: 16, color: c.secondary }}
            aria-label={show ? 'Hide password' : 'Show password'}
          >
            {show ? '👁' : '◍'}
          </button>
        ) : null}
      </div>
    </div>
  );
}

function PrimaryBtn({ label, dark }) {
  const c = tok(dark);
  return (
    <button style={{
      width: '100%', height: 54, borderRadius: 16, border: 'none', cursor: 'pointer',
      background: c.primary, color: c.base, fontSize: 17, fontWeight: 600, fontFamily: 'inherit',
    }}>
      {label}
    </button>
  );
}

function GoogleIcon() {
  return (
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.2 5.2C41.5 36.1 44 30.6 44 24c0-1.3-.1-2.6-.4-3.9z"/>
    </svg>
  );
}

function SocialBtn({ provider, dark }) {
  const c = tok(dark);
  const label = provider === 'apple' ? 'Continue with Apple' : 'Continue with Google';
  return (
    <button style={{
      width: '100%', height: 54, borderRadius: 16, border: `1px solid ${c.border}`, cursor: 'pointer',
      background: c.base, color: c.primary, fontSize: 17, fontWeight: 500, fontFamily: 'inherit',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
    }}>
      {provider === 'apple' ? (
        <svg width="20" height="20" viewBox="0 0 24 24" fill={c.primary} style={{ transform: 'translateY(-1px)' }}>
          <path d="M17.05 12.54c-.03-2.53 2.06-3.75 2.15-3.81-1.17-1.71-2.99-1.95-3.64-1.97-1.55-.16-3.02.91-3.81.91-.79 0-2.02-.89-3.31-.86-1.7.02-3.27.99-4.14 2.52-1.77 3.07-.45 7.61 1.27 10.1.84 1.22 1.84 2.59 3.15 2.54 1.26-.05 1.74-.81 3.26-.81 1.53 0 1.96.81 3.29.79 1.36-.03 2.22-1.24 3.06-2.47.96-1.41 1.36-2.77 1.38-2.84-.03-.01-2.65-1.02-2.66-4.1zM14.14 5.3c.7-.85 1.17-2.03 1.04-3.2-1.01.04-2.23.67-2.95 1.51-.65.75-1.22 1.95-1.06 3.1 1.12.09 2.27-.57 2.97-1.41z"/>
        </svg>
      ) : <GoogleIcon />}
      {label}
    </button>
  );
}

function Divider({ label, dark }) {
  const c = tok(dark);
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 14, width: '100%' }}>
      <div style={{ flex: 1, height: 1, background: c.border }} />
      <span style={{ fontSize: 13, color: c.tertiary, whiteSpace: 'nowrap' }}>{label}</span>
      <div style={{ flex: 1, height: 1, background: c.border }} />
    </div>
  );
}

function Footer({ question, link, dark }) {
  const c = tok(dark);
  return (
    <div style={{ display: 'flex', justifyContent: 'center', gap: 6, fontSize: 15 }}>
      <span style={{ color: c.secondary }}>{question}</span>
      <span style={{ color: c.primary, fontWeight: 600 }}>{link}</span>
    </div>
  );
}

function BackHeader({ title, dark }) {
  const c = tok(dark);
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%' }}>
      <div style={{ width: 36, height: 36, borderRadius: 18, background: c.surface, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, color: c.primary }}>‹</div>
      <span style={{ fontSize: 22, fontWeight: 700, color: c.primary }}>{title}</span>
    </div>
  );
}

/* ---------- Direction 1 · "Quiet Field" — email-first centered classic ---------- */
function D1Column({ dark, children }) {
  const c = tok(dark);
  return (
    <div style={{
      width: '100%', height: '100%', background: c.base, color: c.primary,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      padding: 24, gap: 13, overflow: 'auto',
    }}>
      {children}
    </div>
  );
}

function D1Login({ dark }) {
  const c = tok(dark);
  return (
    <D1Column dark={dark}>
      <Wordmark dark={dark} size={26} />
      <div style={{ fontSize: 28, fontWeight: 800, color: c.primary, marginTop: 6 }}>Welcome back</div>
      <div style={{ fontSize: 15, color: c.secondary, textAlign: 'center', maxWidth: 290 }}>Sign in to keep your habits in sync.</div>
      <Field label="Email" placeholder="you@example.com" dark={dark} />
      <Field label="Password" placeholder="Your password" dark={dark} secure />
      <div style={{ width: '100%', textAlign: 'right' }}>
        <span style={{ fontSize: 15, color: c.secondary, textDecoration: 'underline' }}>Forgot password?</span>
      </div>
      <PrimaryBtn label="Sign In" dark={dark} />
      <Divider label="or continue with" dark={dark} />
      <SocialBtn provider="apple" dark={dark} />
      <SocialBtn provider="google" dark={dark} />
      <Footer question="New to Habu?" link="Create account" dark={dark} />
    </D1Column>
  );
}

function D1Signup({ dark }) {
  const c = tok(dark);
  return (
    <D1Column dark={dark}>
      <Wordmark dark={dark} size={26} />
      <div style={{ fontSize: 28, fontWeight: 800, color: c.primary, marginTop: 6 }}>Create your account</div>
      <div style={{ fontSize: 15, color: c.secondary, textAlign: 'center', maxWidth: 300 }}>One account keeps your data safe across devices.</div>
      <Field label="Email" placeholder="you@example.com" dark={dark} />
      <Field label="Password" placeholder="8+ characters" dark={dark} secure />
      <Field label="Confirm password" placeholder="Repeat password" dark={dark} secure />
      <PrimaryBtn label="Create Account" dark={dark} />
      <Divider label="or continue with" dark={dark} />
      <SocialBtn provider="apple" dark={dark} />
      <SocialBtn provider="google" dark={dark} />
      <Footer question="Already have an account?" link="Sign in" dark={dark} />
    </D1Column>
  );
}

function D1Forgot({ dark }) {
  const c = tok(dark);
  return (
    <D1Column dark={dark}>
      <div style={{ width: '100%' }}><BackHeader title="Forgot password" dark={dark} /></div>
      <div style={{ fontSize: 28, fontWeight: 800, color: c.primary, marginTop: 26 }}>Reset your password</div>
      <div style={{ fontSize: 15, color: c.secondary, textAlign: 'center', maxWidth: 300 }}>Enter your email and we will send you a link to reset your password.</div>
      <Field label="Email" placeholder="you@example.com" dark={dark} />
      <PrimaryBtn label="Send reset link" dark={dark} />
      <Footer question="Remembered it?" link="Back to sign in" dark={dark} />
    </D1Column>
  );
}

function D1Reset({ dark }) {
  const c = tok(dark);
  return (
    <D1Column dark={dark}>
      <div style={{ width: '100%' }}><BackHeader title="Set a new password" dark={dark} /></div>
      <div style={{ fontSize: 28, fontWeight: 800, color: c.primary, marginTop: 26 }}>Choose a strong password</div>
      <div style={{ fontSize: 15, color: c.secondary, textAlign: 'center', maxWidth: 300 }}>At least 8 characters. Try a phrase only you would know.</div>
      <Field label="New password" placeholder="8+ characters" dark={dark} secure />
      <Field label="Confirm password" placeholder="Repeat password" dark={dark} secure />
      <PrimaryBtn label="Save password" dark={dark} />
      <Footer question="Changed your mind?" link="Back to sign in" dark={dark} />
    </D1Column>
  );
}

/* ---------- device frames (skill assets, inlined) ---------- */
const frameS = {
  wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 60, boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, fontFamily: 'inherit', zIndex: 20, pointerEvents: 'none' },
  island: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  home: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999, zIndex: 10 },
  homeDark: { background: 'rgba(255,255,255,0.5)' },
};

function IosFrame({ children, width = 393, height = 852, dark = false }) {
  const tcol = dark ? '#fff' : '#000';
  return (
    <div style={frameS.wrapper}>
      <div style={{ ...frameS.screen, width, height, background: dark ? '#000' : '#fff' }}>
        <div style={{ ...frameS.statusBar, color: tcol }}>
          <span>9:41</span>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 }}>
              {[4, 6, 9, 11].map((h, i) => <div key={i} style={{ width: 3, height: h, background: tcol, borderRadius: 1 }} />)}
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: tcol }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={{ width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8 }}>
              <div style={{ width: '100%', height: '100%', background: tcol, borderRadius: 1, opacity: 0.9 }} />
              <div style={{ position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: tcol, borderRadius: '0 1px 1px 0' }} />
            </div>
          </div>
        </div>
        <div style={frameS.island} />
        <div style={frameS.content}>{children}</div>
        <div style={{ ...frameS.home, ...(dark ? frameS.homeDark : {}) }} />
      </div>
    </div>
  );
}

const aS = {
  wrapper: { display: 'inline-block', padding: 10, background: '#1a1a1a', borderRadius: 44, boxShadow: '0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 36, overflow: 'hidden', background: '#fff' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 24px', fontSize: 14, fontWeight: 500, fontFamily: 'inherit', zIndex: 20, pointerEvents: 'none' },
  punch: { position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)', width: 14, height: 14, background: '#000', borderRadius: '50%', zIndex: 30 },
  content: { position: 'absolute', top: 32, left: 0, right: 0, bottom: 24, overflow: 'auto' },
  nav: { position: 'absolute', bottom: 0, left: 0, right: 0, height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10 },
};

function AndroidFrame({ children, width = 412, height = 892, dark = false }) {
  const tcol = dark ? '#fff' : '#1a1a1a';
  return (
    <div style={aS.wrapper}>
      <div style={{ ...aS.screen, width, height, background: dark ? '#000' : '#fff' }}>
        <div style={{ ...aS.statusBar, color: tcol }}>
          <span>9:41</span>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor">
              <rect x="0" y="6" width="2" height="4" rx="0.5" /><rect x="4" y="4" width="2" height="6" rx="0.5" /><rect x="8" y="2" width="2" height="8" rx="0.5" /><rect x="12" y="0" width="2" height="10" rx="0.5" />
            </svg>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
              <path d="M7 9a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 6a5 5 0 018 0" stroke="currentColor" strokeWidth="1.2" />
              <path d="M0.5 3.5a11 11 0 0113 0" stroke="currentColor" strokeWidth="1.2" opacity="0.6" />
            </svg>
            <div style={{ width: 22, height: 10, border: '1.5px solid currentColor', borderRadius: 2, padding: 1, position: 'relative' }}>
              <div style={{ width: '100%', height: '100%', background: tcol, borderRadius: 1 }} />
            </div>
            <span style={{ fontSize: 11, fontWeight: 600, marginLeft: 2 }}>100%</span>
          </div>
        </div>
        <div style={aS.punch} />
        <div style={aS.content}>{children}</div>
        <div style={aS.nav}><div style={{ width: 100, height: 4, background: dark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.4)', borderRadius: 999 }} /></div>
      </div>
    </div>
  );
}

/* ---------- board ---------- */
function FrameSet({ caption, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
      {children}
      <div style={{ fontSize: 13, color: '#6B6B6B', fontWeight: 500 }}>{caption}</div>
    </div>
  );
}

function App() {
  return (
    <div>
      <div style={{ maxWidth: 1120, margin: '0 auto 28px' }}>
        <div style={{ display: 'inline-block', padding: '4px 12px', borderRadius: 999, background: '#0A0A0A', color: '#fff', fontSize: 13, fontWeight: 700, letterSpacing: 0.4 }}>DIRECTION 1 OF 3</div>
        <h1 style={{ fontSize: 34, fontWeight: 800, marginTop: 14, letterSpacing: -0.5 }}>Quiet Field</h1>
        <p style={{ fontSize: 17, color: '#6B6B6B', maxWidth: 640, marginTop: 8, lineHeight: 1.5 }}>
          The classic, by-the-book auth form — email first, social second, everything centered and calm. Closest to the current app and the design doc's quiet system, just executed precisely.
        </p>
        <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
          {['#FFFFFF', '#F5F5F5', '#E0E0E0', '#0A0A0A', '#6B6B6B', '#A3A3A3'].map((h) => (
            <div key={h} style={{ width: 44, height: 28, borderRadius: 8, background: h, border: '1px solid #D8D8D8', boxShadow: 'inset 0 0 0 0' }} />
          ))}
        </div>
        <p style={{ fontSize: 13, color: '#A3A3A3', marginTop: 8 }}>Single column, centered · email-first hierarchy · underlined helper links · divider before social buttons</p>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 28, justifyContent: 'center' }}>
        <FrameSet caption="Login · iPhone 15 Pro (393×852)">
          <IosFrame><D1Login /></IosFrame>
        </FrameSet>
        <FrameSet caption="Login · iPhone SE (375×667) — small screen">
          <IosFrame width={375} height={667}><D1Login /></IosFrame>
        </FrameSet>
        <FrameSet caption="Login · Android Pixel (412×892)">
          <AndroidFrame><D1Login /></AndroidFrame>
        </FrameSet>
        <FrameSet caption="Login · iOS Dark Mode">
          <IosFrame dark><D1Login dark /></IosFrame>
        </FrameSet>
        <FrameSet caption="Sign Up · iPhone">
          <IosFrame><D1Signup /></IosFrame>
        </FrameSet>
        <FrameSet caption="Forgot Password · iPhone">
          <IosFrame><D1Forgot /></IosFrame>
        </FrameSet>
        <FrameSet caption="Reset Password · iPhone">
          <IosFrame><D1Reset /></IosFrame>
        </FrameSet>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
